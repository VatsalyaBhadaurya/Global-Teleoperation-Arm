[project]
name = "teleop-protocol"
version = "0.1.0"
description = "Shared message protocol for the remote teleoperation system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teleop_protocol*"]
