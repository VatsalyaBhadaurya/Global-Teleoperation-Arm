[project]
name = "teleop-gateway-common"
version = "0.1.0"
description = "Shared gateway utilities (signaling client, WebRTC helpers, watchdog, ROS interface) for leader/follower gateways"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "aiortc>=1.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teleop_gateway_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
