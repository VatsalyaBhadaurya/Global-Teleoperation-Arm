# coturn configuration template for the teleop TURN/STUN server.
#
# Copy this file, fill in the realm/credentials/certificates for your
# deployment, and mount it into the coturn container (see
# deploy/docker/docker-compose.yml).
#
# The corresponding ICE server entry for the gateways/operator UI is:
#   stun:<server-name>:3478,turn:<server-name>:3478|<user>|<password>
# (set via the TELEOP_ICE_SERVERS env var, see shared/gateway_common's
# ice_servers_from_env and docs/runbooks/operations.md)

listening-port=3478
tls-listening-port=5349

# Relay port range opened to clients; ensure this range is open in your
# firewall/security group.
min-port=49152
max-port=65535

realm=teleop.example.com
server-name=teleop.example.com

# Static long-term credential. Replace with your own user:password.
user=teleop:change-me
lt-cred-mech

fingerprint
no-cli

# TLS (TURNS) -- uncomment and point at real certificates to support wss
# operators behind networks that block plain UDP/TCP TURN.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

log-file=stdout
