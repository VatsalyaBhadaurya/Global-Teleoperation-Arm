[project]
name = "teleop-leader-gateway"
version = "0.1.0"
description = "Leader-side gateway: ROS bridge, leader_state publisher, data-only WebRTC link to follower"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.7",
    "websockets>=12.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leader_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
