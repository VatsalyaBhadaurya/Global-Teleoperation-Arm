[project]
name = "teleop-follower-gateway"
version = "0.1.0"
description = "Follower-side gateway: ROS bridge, video tracks, command validation, telemetry"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.7",
    "av>=11.0",
    "numpy>=1.26",
    "websockets>=12.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["follower_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
